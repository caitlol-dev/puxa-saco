<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Gerador de frases de puxa-saco para levantar o ego e dar aquela motivada." />
  <title>Gerador de Puxa-Saco</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Gerador de <span>Puxa-Saco</span></h1>

      <p class="subtitle">
        Tá precisando de alguém pra puxar seu saco hoje?
        Clique no botão e receba a bajulação que você merece.
      </p>

      <div class="frase-box" id="fraseBox">
        <p id="frase">
          "Clique no botão. Seu ego está a um passo de ser alimentado."
        </p>
      </div>

      <button id="gerarBtn" class="gerar-btn">
        <span>✨</span>
        Puxa meu saco
      </button>

      <div class="acoes">
        <button id="copiarBtn" class="secundario" disabled>
          Copiar frase
        </button>

        <span id="contador" class="contador">
          0 bajulações recebidas
        </span>
      </div>
    </section>
  </main>

  <div class="decor decor-1"></div>
  <div class="decor decor-2"></div>

  <footer>
    Feito para dias em que a autoestima precisa de um funcionário dedicado.
  </footer>

  <script src="script.js"></script>
</body>
</html>
